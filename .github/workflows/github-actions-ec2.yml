name: Deploy to EC2

on:
  push:
    branches:
      - main  # Deploy when code is pushed to main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          RETRY_COUNT=5
          RETRY_DELAY=10
          until ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
          set -e  # Stop execution on error

          # Navigate to Apache web root
          cd /var/www/html/

          # Pull latest changes from GitHub
          git fetch --all
          git reset --hard origin/main
          git pull origin main --force

          # Set correct permissions
          sudo chown -R www-data:www-data /var/www/html/
          sudo chmod -R 755 /var/www/html/

          # Restart Apache to apply changes
          sudo systemctl restart apache2
          EOF
          do
            if [ $RETRY_COUNT -eq 0 ]; then
              echo "SSH command failed after multiple attempts."
              exit 1
            fi
            echo "SSH command failed. Retrying in $RETRY_DELAY seconds..."
            sleep $RETRY_DELAY
            RETRY_COUNT=$((RETRY_COUNT-1))
          done
